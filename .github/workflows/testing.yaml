
name: Model Training CICD

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  push:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Set up Node.js 20 BEFORE CML installation
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 2: Check out repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 3: Install CML
      - name: Set up CML
        uses: iterative/setup-cml@v1

      # Step 4: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 5: Train models and generate reports
      - name: Train model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          python train_model.py

          echo "# RF and LR Model Scores" > report.md
          cat scores.txt >> report.md

          echo -e "\n# Confusion Matrix and Feature Importance" > report1.md
          echo "![Confusion Matrix](./ConfusionMatrix.png)" >> report1.md
          echo "![Feature Importance](./FeatureImportance.png)" >> report1.md

          cat report.md report1.md > combined_file.md

          cml comment create --publish=false combined_file.md
